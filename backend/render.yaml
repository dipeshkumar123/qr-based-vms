services:
  - type: web
    name: ii-vms-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ii-vms-db
          property: connectionString
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_EXPIRES_IN
        value: 2h
      - key: SERVICE_API_KEY
        generateValue: true
      - key: BIOMETRIC_SERVICE_URL
        value: https://ii-vms-biometrics.onrender.com
      - key: ANALYTICS_SERVICE_URL
        value: https://ii-vms-analytics.onrender.com
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: LOG_LEVEL
        value: info
      - key: ENABLE_RATE_LIMITING
        value: true
      - key: SECURE_COOKIES
        value: true

databases:
  - name: ii-vms-db
    plan: free