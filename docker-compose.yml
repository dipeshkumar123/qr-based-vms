version: "3.9"

# ── Load root .env for shared secrets ────────────────────────────────
# Copy .env.example to .env and fill in your values before running.
# Run: cp .env.example .env
# ─────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ii_vms}
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 4000
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ii_vms}
      CORS_ORIGIN: http://localhost:5173,http://localhost:5174
      BIOMETRIC_SERVICE_URL: http://biometric:8000
      ANALYTICS_SERVICE_URL: http://analytics:8001
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me-local-admin-key}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-change-me-local-jwt-secret}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "import('http').then(h=>h.get('http://localhost:4000/health',r=>{process.exit(r.statusCode===200?0:1)}))"]
      interval: 10s
      timeout: 5s
      retries: 8

  biometric:
    build:
      context: ./biometrics
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8000
      STORAGE_DIR: /biometric_data
      FACE_MATCH_TOLERANCE: "0.6"
      CONFIDENCE_THRESHOLD: "0.70"
      BIOMETRIC_VERIFY_MAX_CONCURRENCY: "4"
      BACKEND_URL: "http://backend:4000"
      SERVICE_API_KEY: ${SERVICE_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - biometric_data:/biometric_data
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  analytics:
    build:
      context: ./biometrics
      dockerfile: Dockerfile.analytics
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8001
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:-ii_vms}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      ANALYTICS_PORT: "8001"
      SERVICE_API_KEY: ${SERVICE_API_KEY:-}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  biometric_data:
