version: "3.9"
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ii_vms
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  biometric:
    build:
      context: ./biometrics
    restart: unless-stopped
    environment:
      STORAGE_DIR: /biometric_data
      FACE_MATCH_TOLERANCE: "0.6"
      CONFIDENCE_THRESHOLD: "0.70"
      BACKEND_URL: "http://host.docker.internal:4000"
    ports:
      - "8000:8000"
    volumes:
      - biometric_data:/biometric_data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  analytics:
    build:
      context: ./biometrics
      dockerfile: Dockerfile.analytics
    restart: unless-stopped
    environment:
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "ii_vms"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      ANALYTICS_PORT: "8001"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  biometric_data:
