version: "3.9"
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ii_vms
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  biometric:
    build:
      context: ./biometrics
    restart: unless-stopped
    environment:
      STORAGE_DIR: /biometric_data
      FACE_MATCH_TOLERANCE: "0.6"
      CONFIDENCE_THRESHOLD: "0.70"
      BACKEND_URL: "http://backend:4000"
    ports:
      - "8000:8000"
    volumes:
      - biometric_data:/biometric_data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ii_vms
      CORS_ORIGIN: http://localhost:5173,http://localhost:5174,http://localhost:3000
      ADMIN_API_KEY: dev-admin-key-change-in-production
      ADMIN_JWT_SECRET: dev-jwt-secret-change-in-production
      BIOMETRIC_SERVICE_URL: http://biometric:8000
      ANALYTICS_SERVICE_URL: http://analytics:8001
      UPLOAD_DIR: /app/uploads
      LOG_LEVEL: debug
    ports:
      - "4000:4000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "import('http').then(h=>h.get('http://localhost:4000/health',r=>{process.exit(r.statusCode===200?0:1)}))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  analytics:
    build:
      context: ./biometrics
      dockerfile: Dockerfile.analytics
    restart: unless-stopped
    environment:
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "ii_vms"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      ANALYTICS_PORT: "8001"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  biometric_data:
  uploads_data:
