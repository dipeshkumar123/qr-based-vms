# Render Blueprint for II-VMS
# Deploys: PostgreSQL + Backend + Biometrics + Analytics
# Connect repo → "New +" → "Blueprint" → select repo

databases:
  - name: ii-vms-db
    plan: free

services:
  # ── Backend (Node.js/Express) ──────────────────────────────────
  - type: web
    name: ii-vms-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ii-vms-db
          property: connectionString
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_EXPIRES_IN
        value: 2h
      - key: SERVICE_API_KEY
        generateValue: true
      - key: BIOMETRIC_SERVICE_URL
        value: https://ii-vms-biometrics.onrender.com
      - key: ANALYTICS_SERVICE_URL
        value: https://ii-vms-analytics.onrender.com
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: LOG_LEVEL
        value: info

  # ── Biometrics (Python/FastAPI - face recognition) ─────────────
  - type: web
    name: ii-vms-biometrics
    runtime: docker
    plan: free
    dockerfilePath: ./biometrics/Dockerfile
    dockerContext: ./biometrics
    envVars:
      - key: PORT
        value: 8000
      - key: STORAGE_DIR
        value: /var/data
      - key: FACE_MATCH_TOLERANCE
        value: "0.6"
      - key: CONFIDENCE_THRESHOLD
        value: "0.70"
      - key: BACKEND_URL
        value: https://ii-vms-backend.onrender.com
      - key: SERVICE_API_KEY
        fromService:
          type: web
          name: ii-vms-backend
          envVarKey: SERVICE_API_KEY

  # ── Analytics (Python/FastAPI - ML insights) ───────────────────
  - type: web
    name: ii-vms-analytics
    runtime: docker
    plan: free
    dockerfilePath: ./biometrics/Dockerfile.analytics
    dockerContext: ./biometrics
    envVars:
      - key: PORT
        value: 8001
      - key: ANALYTICS_PORT
        value: 8001
      - key: DATABASE_URL
        fromDatabase:
          name: ii-vms-db
          property: connectionString
      - key: SERVICE_API_KEY
        fromService:
          type: web
          name: ii-vms-backend
          envVarKey: SERVICE_API_KEY